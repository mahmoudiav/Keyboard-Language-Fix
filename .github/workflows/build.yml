name: Build

# Two jobs:
#   test   — the browser extension and the shared conversion engine (fast, Linux)
#   windows — builds KeyboardLanguageFix.exe and attaches it to the run
#
# The Windows job means you never have to install the .NET SDK yourself: push,
# open the run under the Actions tab, and download the exe from Artifacts.

on:
  push:
    branches: ['**']
    # Prose changes cannot break a build. Without this, editing the README
    # spends ten minutes of runners proving nothing.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# Several pushes in a row should not queue several full builds. Only the newest
# commit on a branch is worth checking; the rest are already out of date.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Extension and engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: windows/**/*.csproj

      - name: Unit, manifest, locale and generated-file checks
        run: npm test

      - name: Conversion engine and JavaScript/C# parity
        run: dotnet test windows/KeyboardLanguageFix.sln --nologo

      - name: MSIX packaging checks
        shell: pwsh
        run: ./windows/build/test-build-msix.ps1

      - name: Install Chromium for the end-to-end tests
        run: |
          npm install --no-save playwright@^1.56.0
          npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Package the extension
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: dist/*.zip
          if-no-files-found: error

  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: windows/**/*.csproj

      # NSIS cross-compiles, so the Windows installer is built and checked here
      # on every push rather than only at release time.
      - name: Install NSIS and 7z
        run: sudo apt-get update && sudo apt-get install -y nsis p7zip-full

      - name: Build and verify the installer
        run: ./windows/build/build-setup.sh x64

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardLanguageFix-Setup
          path: windows/dist/*-Setup.exe
          if-no-files-found: error

  windows:
    # Proves the app still builds on a real Windows machine, since everything
    # else here cross-compiles. One architecture is enough for that; the release
    # workflow builds ARM64 when it matters.
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: windows/**/*.csproj

      - name: Build the executable
        shell: pwsh
        run: ./windows/build/build-exe.ps1 -Architecture x64 -Output out

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardLanguageFix-x64
          path: out/KeyboardLanguageFix.exe
          if-no-files-found: error
